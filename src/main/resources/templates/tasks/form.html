<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section}, ${pageTitle})}">
<section>
  <h2 th:text="${pageTitle}">タスク</h2>

  <form th:action="@{${formAction}}" th:object="${taskForm}" method="post">
    <div style="margin-bottom:12px;">
      <label>タイトル</label><br/>
      <input type="text" th:field="*{title}" style="width:100%;max-width:480px;" />
      <div class="field-error"
           th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}"></div>
    </div>

    <div style="margin-bottom:12px;">
      <label>
        <input type="checkbox" th:field="*{completed}" />
        完了
      </label>
    </div>

    <div style="margin-top:16px;">
      <button type="submit">保存</button>
      <a th:href="@{/tasks}" style="margin-left:8px;">戻る</a>
    </div>
  </form>
</section>
</html>
