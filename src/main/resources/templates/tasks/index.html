<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::section}, 'タスク一覧')}">
<section>
  <div style="margin-bottom:12px;">
    <a th:href="@{/tasks/new}">+ 新規作成</a>
  </div>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>タイトル</th>
      <th>完了</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${tasks}">
      <td th:text="${task.id}"></td>
      <td th:text="${task.title}"></td>
      <td th:text="${task.completed} ? '完了' : '未完了'"></td>
      <td class="actions">
        <a th:href="@{|/tasks/${task.id}/edit|}">編集</a>

        <form th:action="@{|/tasks/${task.id}/delete|}" method="post">
          <button type="submit">削除</button>
        </form>

        <form th:action="@{|/tasks/${task.id}/toggle|}" method="post">
          <button type="submit"
                  th:text="${task.completed} ? '未完了に戻す' : '完了にする'"></button>
        </form>
      </td>
    </tr>

    <tr th:if="${#lists.isEmpty(tasks)}">
      <td colspan="4">タスクがありません</td>
    </tr>
    </tbody>
  </table>
</section>
</html>
